// Auto-signing — absolute project keystore
def ksFile = file("/home/runner/work/Vanilla-Conquer/Vanilla-Conquer/android-project/signing/debug.keystore")
if (!ksFile.exists()) {
    def outDir = ksFile.parentFile
    outDir.mkdirs()
    def cmd = [
        "keytool", "-genkeypair",
        "-keystore", ksFile.absolutePath,
        "-storepass", "android", "-keypass", "android",
        "-alias", "androiddebugkey", "-keyalg", "RSA", "-keysize", "2048",
        "-validity", "10000",
        "-dname", "CN=Vanilla Conquer Android,O=VanillaConquer,C=US"
    ]
    def proc = cmd.execute()
    proc.waitForProcessOutput(System.out, System.err)
    if (!ksFile.exists()) throw new GradleException("keytool failed for ${ksFile}")
}
android {
    signingConfigs {
        debugKeys {
            storeFile ksFile
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debugKeys }
        release { signingConfig signingConfigs.debugKeys }
    }
}
