def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
} else {
    apply plugin: 'com.android.library'
}

// Shared auto-signing (project debug keystore under android-port/signing/)
apply from: "/home/runner/work/Vanilla-Conquer/Vanilla-Conquer/android-project/signing/signing.gradle"

android {
    namespace "com.vanilla_conquer.ra"
    compileSdk 34
    defaultConfig {
        applicationId "com.vanilla_conquer.ra"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    lint {
        abortOnError false
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // Ignore accidental temp files in jniLibs
            excludes += ['**/*.temp-stream-*']
        }
        resources {
            excludes += ['**/*.temp-stream-*']
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
